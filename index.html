<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OLD SCHOOL TIMUR MUSIC</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    background:
        radial-gradient(circle at center,#3b3b3b 0%,#171717 48%,#070707 100%);
    font-family:Georgia,"Times New Roman",serif;
    color:#eee;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:12px;
}

/* =========================
   BODY CONSOLE
========================= */

.speaker{
    width:100%;
    max-width:520px;
    background:
        linear-gradient(145deg,#494949,#282828 40%,#111);
    border:5px solid #090909;
    border-radius:18px;
    padding:15px;
    box-shadow:
        0 20px 45px #000,
        inset 0 0 0 2px #666,
        inset 0 0 20px #000;
}

/* =========================
   BRAND
========================= */

.brand{
    text-align:center;
    margin-bottom:10px;
}

.brand h1{
    font-size:32px;
    letter-spacing:7px;
    color:#e7b928;
    text-shadow:2px 2px #000;
}

.brand p{
    font-family:Arial,sans-serif;
    font-size:8px;
    letter-spacing:3px;
    color:#999;
    margin-top:2px;
}

/* =========================
   MAIN FRONT PANEL
========================= */

.grille{
    background:
        radial-gradient(#555 1px,transparent 1px);
    background-size:7px 7px;
    background-color:#111;
    border:3px solid #080808;
    border-radius:12px;
    padding:10px;
    box-shadow:inset 0 0 18px #000;
}

/* =========================
   DISPLAY
========================= */

.visualizer-screen{
    height:105px;
    background:
        linear-gradient(#101010,#030303);
    border:4px solid #070707;
    border-radius:7px;
    position:relative;
    overflow:hidden;
    box-shadow:
        inset 0 0 15px #000,
        0 0 0 1px #555;
}

.screen-brand{
    position:absolute;
    top:5px;
    width:100%;
    text-align:center;
    font-size:8px;
    letter-spacing:4px;
    color:#777;
    z-index:3;
}

.screen-left,
.screen-right{
    position:absolute;
    bottom:5px;
    font-family:Arial,sans-serif;
    font-size:6px;
    letter-spacing:1px;
    color:#555;
    z-index:3;
}

.screen-left{left:7px;}
.screen-right{right:7px;}

#visualizer{
    width:100%;
    height:100%;
    display:block;
}

/* =========================
   LOWER PANEL
========================= */

.lower-panel{
    display:grid;
    grid-template-columns:150px 1fr;
    gap:12px;
    align-items:center;
    margin-top:10px;
}

/* =========================
   WOOFER
========================= */

.woofer{
    width:130px;
    height:130px;
    margin:auto;
    border-radius:50%;

    background:
        radial-gradient(
            circle,
            #888 0 7%,
            #202020 8% 18%,
            #666 19% 23%,
            #171717 24% 42%,
            #555 43% 46%,
            #111 47% 100%
        );

    border:7px solid #070707;

    box-shadow:
        0 0 0 4px #555,
        0 8px 18px #000;
}

.woofer.playing{
    animation:bass .45s infinite alternate;
}

@keyframes bass{
    from{transform:scale(1);}
    to{transform:scale(1.035);}
}

/* =========================
   SONG INFO
========================= */

.song-info{
    min-width:0;
}

#title{
    color:#e7b928;
    font-size:16px;
    font-weight:bold;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    text-shadow:1px 1px #000;
}

#status{
    font-family:Arial,sans-serif;
    color:#999;
    font-size:10px;
    margin-top:4px;
}

/* =========================
   PROGRESS
========================= */

.progress-area{
    margin-top:10px;
}

input[type="range"]{
    width:100%;
    accent-color:#e7b928;
}

.time{
    display:flex;
    justify-content:space-between;
    font-family:Arial,sans-serif;
    font-size:9px;
    color:#888;
}

/* =========================
   CONTROLS
========================= */

.controls{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:14px;
    margin:10px 0;
}

button{
    border:none;
    cursor:pointer;
    color:#eee;
    background:linear-gradient(#555,#171717);
    border:2px solid #666;
    box-shadow:
        0 4px 8px #000,
        inset 0 1px #777;
}

button:active{
    transform:translateY(2px);
}

.small-btn{
    width:42px;
    height:42px;
    border-radius:50%;
    font-size:16px;
}

.play-btn{
    width:58px;
    height:58px;
    border-radius:50%;
    font-size:23px;
    color:#111;
    background:
        radial-gradient(
            circle at 35% 30%,
            #ffe88a,
            #e7b928 50%,
            #8f6b05
        );
    border-color:#f4d35e;
}

/* =========================
   VOLUME
========================= */

.volume{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:10px;
}

.volume span{
    font-size:15px;
}

/* =========================
   PLAYLIST
========================= */

.playlist{
    background:#0d0d0d;
    border:2px solid #333;
    border-radius:9px;
    overflow:hidden;
}

.playlist-title{
    padding:8px;
    background:linear-gradient(#303030,#1b1b1b);
    color:#e7b928;
    font-size:10px;
    letter-spacing:2px;
    text-align:center;
}

.song{
    padding:9px 10px;
    border-top:1px solid #303030;
    cursor:pointer;
    font-family:Arial,sans-serif;
    font-size:10px;
}

.song:hover{
    background:#292929;
}

.song.active{
    background:#3a3016;
    color:#e7b928;
    border-left:4px solid #e7b928;
}

/* =========================
   FOOTER
========================= */

.footer{
    text-align:center;
    margin-top:8px;
    color:#666;
    font-family:Arial,sans-serif;
    font-size:7px;
    letter-spacing:2px;
}


/* =========================
   HP KECIL
========================= */

@media(max-width:380px){

    .speaker{
        padding:11px;
    }

    .brand h1{
        font-size:27px;
    }

    .lower-panel{
        grid-template-columns:120px 1fr;
        gap:8px;
    }

    .woofer{
        width:105px;
        height:105px;
    }

    .visualizer-screen{
        height:90px;
    }

}
</style>
</head>

<body>

<div class="speaker">

    <div class="brand">
        <h1>CHARLES</h1>
        <p>OLD SCHOOL TIMUR COLLECTION</p>
    </div>

    <div class="grille">

        <!-- DISPLAY -->
        <div class="visualizer-screen">

            <div class="screen-brand">
                CHARLES • STEREO
            </div>

            <div class="screen-left">
                BASS
            </div>

            <div class="screen-right">
                TREBLE
            </div>

            <canvas id="visualizer"></canvas>

        </div>

        <!-- WOOFER + SONG -->
        <div class="lower-panel">

            <div class="woofer" id="woofer"></div>

            <div class="song-info">

                <div id="title">
                    CFS feat TOTON CARIBO
                </div>

                <div id="status">
                    Siap diputar
                </div>

                <div class="progress-area">

                    <input
                        type="range"
                        id="progress"
                        min="0"
                        max="100"
                        value="0"
                    >

                    <div class="time">
                        <span id="currentTime">0:00</span>
                        <span id="duration">0:00</span>
                    </div>

                </div>

            </div>

        </div>

        <!-- CONTROLS -->
        <div class="controls">

            <button class="small-btn" id="prev">
                ⏮
            </button>

            <button class="play-btn" id="play">
                ▶
            </button>

            <button class="small-btn" id="next">
                ⏭
            </button>

        </div>

        <!-- VOLUME -->
        <div class="volume">

            <span>🔊</span>

            <input
                type="range"
                id="volume"
                min="0"
                max="1"
                step="0.01"
                value="0.8"
            >

        </div>

    </div>

    <!-- PLAYLIST -->
    <div class="playlist">

        <div class="playlist-title">
            CHARLES MUSIC COLLECTION
        </div>

        <div class="song active" data-index="0">
            CFS feat TOTON CARIBO
        </div>

        <div class="song" data-index="1">
            CFS-MLAM BAE
        </div>

        <div class="song" data-index="2">
            CFS-FLORENTINA
        </div>

        <div class="song" data-index="3">
            CFS-JALAN BERLUBANG
        </div>

    </div>

    <div class="footer">
        © CHARLES • OLD SCHOOL AUDIO
    </div>

</div>

<audio id="audio"></audio>

<script>

/* =========================
   MUSIC
========================= */

const songs = [

    {
        title:"CFS feat TOTON CARIBO",
        file:"musik/CFS feat TOTON CARIBO.mp3"
    },

    {
        title:"CFS-MLAM BAE",
        file:"musik/CFS-MLAM BAE.mp3"
    },

    {
        title:"CFS-FLORENTINA",
        file:"musik/CFS-FLORENTINA.mp3"
    },

    {
        title:"CFS-JALAN BERLUBANG",
        file:"musik/CFS-JALAN BERLUBANG.mp3"
    }

];


/* =========================
   ELEMENT
========================= */

const audio =
document.getElementById("audio");

const playBtn =
document.getElementById("play");

const prevBtn =
document.getElementById("prev");

const nextBtn =
document.getElementById("next");

const progress =
document.getElementById("progress");

const volume =
document.getElementById("volume");

const title =
document.getElementById("title");

const status =
document.getElementById("status");

const currentTime =
document.getElementById("currentTime");

const duration =
document.getElementById("duration");

const woofer =
document.getElementById("woofer");

const songElements =
document.querySelectorAll(".song");

const canvas =
document.getElementById("visualizer");

const ctx =
canvas.getContext("2d");


let currentSong = 0;

let audioContext;
let analyser;
let source;
let visualizerStarted = false;


/* =========================
   VISUALIZER SETUP
========================= */

function setupVisualizer(){

    if(visualizerStarted) return;

    audioContext =
        new(
            window.AudioContext ||
            window.webkitAudioContext
        )();

    analyser =
        audioContext.createAnalyser();

    analyser.fftSize = 128;

    analyser.smoothingTimeConstant = .78;

    source =
        audioContext
        .createMediaElementSource(audio);

    source.connect(analyser);

    analyser.connect(
        audioContext.destination
    );

    visualizerStarted = true;

    drawVisualizer();
}


/* =========================
   VISUALIZER
========================= */

function drawVisualizer(){

    requestAnimationFrame(drawVisualizer);

    const width =
        canvas.clientWidth;

    const height =
        canvas.clientHeight;

    if(
        canvas.width !== width ||
        canvas.height !== height
    ){

        canvas.width = width;
        canvas.height = height;

    }

    ctx.clearRect(
        0,
        0,
        width,
        height
    );

    ctx.fillStyle="#050505";

    ctx.fillRect(
        0,
        0,
        width,
        height
    );

    if(!analyser) return;

    const bufferLength =
        analyser.frequencyBinCount;

    const dataArray =
        new Uint8Array(bufferLength);

    analyser.getByteFrequencyData(
        dataArray
    );

    const bars = 32;
    const gap = 3;

    const barWidth =
        (
            width -
            gap * (bars - 1)
        ) / bars;

    for(
        let i=0;
        i<bars;
        i++
    ){

        const index =
            Math.floor(
                i *
                bufferLength /
                bars
            );

        let value =
            dataArray[index];

        let barHeight =
            (
                value / 255
            ) *
            (height - 22);

        if(barHeight < 3)
            barHeight = 3;

        const x =
            i *
            (barWidth + gap);

        const y =
            height -
            barHeight -
            5;

        ctx.shadowBlur = 8;
        ctx.shadowColor = "#e7b928";

        const gradient =
            ctx.createLinearGradient(
                0,
                y,
                0,
                height
            );

        gradient.addColorStop(
            0,
            "#fff0a0"
        );

        gradient.addColorStop(
            .3,
            "#e7b928"
        );

        gradient.addColorStop(
            1,
            "#765700"
        );

        ctx.fillStyle = gradient;

        ctx.fillRect(
            x,
            y,
            barWidth,
            barHeight
        );
    }

    ctx.shadowBlur = 0;

    ctx.fillStyle="#555";

    ctx.fillRect(
        0,
        height-3,
        width,
        2
    );
}


/* =========================
   LOAD SONG
========================= */

function loadSong(index){

    currentSong = index;

    audio.src =
        songs[index].file;

    title.textContent =
        songs[index].title;

    songElements.forEach(song=>{
        song.classList.remove("active");
    });

    songElements[index]
        .classList.add("active");

    progress.value=0;

    status.textContent =
        "Siap diputar";
}


/* =========================
   PLAY
========================= */

function playSong(){

    setupVisualizer();

    if(
        audioContext &&
        audioContext.state ===
        "suspended"
    ){

        audioContext.resume();

    }

    audio.play()
    .then(()=>{

        playBtn.textContent="⏸";

        status.textContent=
            "Sedang diputar";

        woofer.classList.add(
            "playing"
        );

    })
    .catch(error=>{

        status.textContent=
            "Tekan PLAY untuk memulai";

        console.log(error);

    });
}


/* =========================
   PAUSE
========================= */

function pauseSong(){

    audio.pause();

    playBtn.textContent="▶";

    status.textContent="Dijeda";

    woofer.classList.remove(
        "playing"
    );
}


/* =========================
   PLAY BUTTON
========================= */

playBtn.addEventListener(
    "click",
    ()=>{

        if(audio.paused)
            playSong();
        else
            pauseSong();

    }
);


/* =========================
   NEXT
========================= */

nextBtn.addEventListener(
    "click",
    ()=>{

        currentSong++;

        if(
            currentSong >=
            songs.length
        )
            currentSong=0;

        loadSong(currentSong);

        playSong();

    }
);


/* =========================
   PREVIOUS
========================= */

prevBtn.addEventListener(
    "click",
    ()=>{

        currentSong--;

        if(currentSong<0)
            currentSong =
                songs.length-1;

        loadSong(currentSong);

        playSong();

    }
);


/* =========================
   PLAYLIST
========================= */

songElements.forEach(song=>{

    song.addEventListener(
        "click",
        ()=>{

            const index =
                Number(
                    song.dataset.index
                );

            loadSong(index);

            playSong();

        }
    );

});


/* =========================
   PROGRESS
========================= */

audio.addEventListener(
    "timeupdate",
    ()=>{

        if(!audio.duration)
            return;

        progress.value =
            (
                audio.currentTime /
                audio.duration
            ) * 100;

        currentTime.textContent =
            formatTime(
                audio.currentTime
            );

    }
);


/* =========================
   DURATION
========================= */

audio.addEventListener(
    "loadedmetadata",
    ()=>{

        duration.textContent =
            formatTime(
                audio.duration
            );

    }
);


/* =========================
   SEEK
========================= */

progress.addEventListener(
    "input",
    ()=>{

        if(!audio.duration)
            return;

        audio.currentTime =
            (
                progress.value /
                100
            ) *
            audio.duration;

    }
);


/* =========================
   VOLUME
========================= */

volume.addEventListener(
    "input",
    ()=>{

        audio.volume =
            volume.value;

    }
);


/* =========================
   AUTO NEXT
========================= */

audio.addEventListener(
    "ended",
    ()=>{

        currentSong++;

        if(
            currentSong >=
            songs.length
        )
            currentSong=0;

        loadSong(currentSong);

        playSong();

    }
);


/* =========================
   TIME
========================= */

function formatTime(seconds){

    if(isNaN(seconds))
        return "0:00";

    const minutes =
        Math.floor(
            seconds/60
        );

    const secs =
        Math.floor(
            seconds%60
        );

    return (
        minutes +
        ":" +
        (secs<10?"0":"") +
        secs
    );
}


/* =========================
   INITIAL
========================= */

audio.volume=.8;

loadSong(0);

</script>

</body>
</html>
